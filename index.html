<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloverLeaf Funeral Services & Memorials</title>
    <meta name="description" content="Browse our genuine granite tombstone collection. CIPC registered monumentalist serving Phoenix, KwaZulu-Natal since 2001. Custom quotes available. Contact Colin Pillay: 072 031 4923">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#228B22",
                        "primary-dark": "#1a6b1a",
                        "background-light": "#f6f8f6",
                        "background-dark": "#0a1a0a",
                        "surface-light": "#ffffff",
                        "surface-dark": "#122412",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    animation: {
                        "pulse-subtle": "pulse-subtle 3s infinite ease-in-out",
                        "reveal-item": "reveal-item 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards",
                    },
                    keyframes: {
                        "pulse-subtle": {
                            "0%, 100%": { transform: "scale(1)" },
                            "50%": { transform: "scale(1.08)" },
                        },
                        "reveal-item": {
                            "0%": { opacity: "0", transform: "translateY(20px) scale(0.95)" },
                            "100%": { opacity: "1", transform: "translateY(0) scale(1)" },
                        }
                    },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }

        @keyframes float {
          0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
          10% { opacity: 0.3; }
          90% { opacity: 0.3; }
          100% { transform: translateY(-100vh) translateX(50px) rotate(360deg); opacity: 0; }
        }
        .animate-clover-float {
          animation: float var(--duration) linear infinite;
          animation-delay: var(--delay);
        }

        /* Refined Soft 3D Glass Effect with Oyster Blue White and Gold Foil */
        .cloverleaf-hero-text {
            display: inline-block;
            background: linear-gradient(
                135deg, 
                #eef6f9 0%,    /* Oyster Blue White hint */
                #ffffff 25%, 
                #f5f9fb 45%,   /* Core Oyster highlight */
                #ffffff 55%, 
                #d9e2e9 75%,   /* Soft Misty Blue */
                #bdc9d4 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Extra padding-right to ensure 'p' in 'Group' is not clipped */
            padding-right: 0.15em;
            cursor: default;
            
            /* Soft 3D Depth + Subtle Gold Foil Edge */
            filter: 
                drop-shadow(1px 1px 0px rgba(255, 255, 255, 0.5)) /* Pearl Highlight */
                drop-shadow(3px 3px 4px rgba(0, 0, 0, 0.15))     /* 3D Depth */
                drop-shadow(0.4px 0.4px 0px rgba(212, 175, 55, 0.25)) /* Thin Gold Edge */
                drop-shadow(-0.4px -0.4px 0px rgba(212, 175, 55, 0.25));
            
            -webkit-text-stroke: 0.1px rgba(212, 175, 55, 0.15);
            position: relative;
            transition: all 0.4s ease-out;
        }

        .dark .cloverleaf-hero-text {
            filter: 
                drop-shadow(1px 1px 0px rgba(255, 255, 255, 0.1))
                drop-shadow(4px 4px 8px rgba(0, 0, 0, 0.5))
                drop-shadow(0.4px 0.4px 0px rgba(255, 223, 0, 0.15))
                drop-shadow(-0.4px -0.4px 0px rgba(255, 223, 0, 0.15));
            -webkit-text-stroke: 0.1px rgba(255, 223, 0, 0.1);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "path": "https://esm.sh/path@^0.12.7",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "url": "https://esm.sh/url@^0.11.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</body>
</html>
